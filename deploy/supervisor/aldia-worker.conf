[program:aldia-queue]
process_name=%(program_name)s_%(process_num)02d
; No fijamos la conexión: queue:work toma QUEUE_CONNECTION del .env
; (database o redis según la infraestructura). Incluye la cola `uptime`
; que usa App\Jobs\CheckUptimeJob.
command=php /srv/aldia/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=default,emails,notifications,uptime --memory=256 --timeout=120
directory=/srv/aldia
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
startretries=3
redirect_stderr=true
stdout_logfile=/srv/aldia/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=120
