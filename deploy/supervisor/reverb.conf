[program:aldia-reverb]
process_name=%(program_name)s
command=php /srv/aldia/artisan reverb:start
directory=/srv/aldia
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
startretries=3
redirect_stderr=true
stdout_logfile=/srv/aldia/storage/logs/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
environment=BROADCAST_CONNECTION="reverb"
