<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#059669">
        <title>Sin conexión · RedCliente</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
                background: #f8fafc;
                color: #0f172a;
            }

            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                place-items: center;
                padding: 1.5rem;
                box-sizing: border-box;
            }

            main {
                width: min(100%, 28rem);
                padding: 2rem;
                border: 1px solid #e2e8f0;
                border-radius: 1.25rem;
                background: #fff;
                text-align: center;
                box-shadow: 0 12px 40px rgb(15 23 42 / 8%);
            }

            h1 {
                margin: 0 0 0.75rem;
                font-size: 1.5rem;
            }

            p {
                margin: 0;
                color: #475569;
                line-height: 1.6;
            }

            button {
                margin-top: 1.5rem;
                padding: 0.75rem 1rem;
                border: 0;
                border-radius: 0.75rem;
                background: #059669;
                color: #fff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    background: #0f172a;
                    color: #f8fafc;
                }

                main {
                    border-color: #334155;
                    background: #1e293b;
                }

                p {
                    color: #cbd5e1;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Estás sin conexión</h1>
            <p>RedCliente necesita conexión para cargar tus datos. Al recuperar internet, vuelve a intentarlo.</p>
            <button type="button" onclick="window.location.reload()">Reintentar</button>
        </main>
    </body>
</html>
